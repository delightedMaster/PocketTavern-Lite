name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, e.g. 0.1.6. Must equal versionName."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate manual release version
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n 1)
          if [ "$VERSION_NAME" != "${{ inputs.version }}" ]; then
            echo "versionName in app/build.gradle.kts is '$VERSION_NAME', but input version is '${{ inputs.version }}'."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # Secrets, all optional. When every one is set, the release APK is signed.
      # Otherwise assembleRelease uploads an unsigned APK.
      # ANDROID_KEYSTORE_BASE64  base64 of the keystore file
      # ANDROID_KEYSTORE_PASSWORD
      # ANDROID_KEY_ALIAS
      # ANDROID_KEY_PASSWORD
      # storeFile is relative to the app module, so app/release.keystore is "release.keystore".
      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            } > local.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release secrets are absent. The APK will be unsigned."
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Rename and package release assets
        run: |
          cd app/build/outputs/apk/release
          for file in *.apk; do
            [ -f "$file" ] || continue
            case "$file" in
              *arm64-v8a*)
                mv "$file" "PocketTavern-Lite-${TAG}-arm64-v8a.apk"
                ;;
              *x86_64*)
                mv "$file" "PocketTavern-Lite-${TAG}-x86_64.apk"
                ;;
              *universal*)
                mv "$file" "PocketTavern-Lite-${TAG}-universal.apk"
                ;;
              *)
                mv "$file" "PocketTavern-Lite-${TAG}-${file}"
                ;;
            esac
          done
          sha256sum *.apk > sha256sums.txt

      - name: Release notes from CHANGELOG
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path
          tag = os.environ.get("TAG", "")
          version = tag[1:] if tag.startswith("v") else tag
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next((i for i, line in enumerate(lines) if line.startswith("## ") and version in line), None)
          if start is None:
              body = "\n".join(lines).strip()
          else:
              end = next((j for j in range(start + 1, len(lines)) if lines[j].startswith("## ")), len(lines))
              body = "\n".join(lines[start:end]).strip()
          signing = (
              "Signing: signed with ANDROID_KEYSTORE_BASE64."
              if os.environ.get("SIGNED") == "true"
              else "Signing: unsigned. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD to sign future tags."
          )
          Path("release-notes.md").write_text(body + "\n\n" + signing + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256sums.txt
          body_path: release-notes.md
